<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Information Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-label {
            font-weight: 500; /* Medium font weight for labels */
            color: #495057; /* Darker text for better readability */
        }
        .form-control, .form-select {
            border-radius: 0.375rem; /* Slightly more rounded corners */
            border-color: #ced4da; /* Default border color */
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.075); /* Subtle shadow */
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out; /* Smooth transition */
        }
        .form-control:focus, .form-select:focus {
            border-color: #007bff; /* Highlight border on focus */
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25); /* Add focus shadow */
        }
        .btn-primary {
            border-radius: 0.375rem; /* Rounded corners for buttons */
            font-weight: 600; /* Medium font weight for buttons */
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0056b3; /* Darker shade on hover */
            border-color: #004085; /* Darker border on hover */
        }
        .btn-primary:active {
            background-color: #004085 !important; /* Keep active color dark */
            border-color: #003366 !important; /* Darker border on active */
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.15) !important; /* Add shadow on active */
            transform: translateY(1px); /* Simulate button press */
        }
        .btn-outline-secondary {
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, color 0.15s ease-in-out;
        }
        .btn-outline-secondary:hover {
            background-color: #e9ecef; /* Light background on hover */
            border-color: #ced4da; /* Keep border color on hover */
            color: #495057;
        }
        .btn-outline-secondary:active {
            background-color: #e2e3e4 !important;
            border-color: #ced4da !important;
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.15) !important;
            transform: translateY(1px);
        }

        .card {
            border-radius: 0.5rem; /* Slightly more rounded corners for cards */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08); /* Subtle card shadow */
            border: 1px solid #e0e0e0;
        }
        .card-header {
            border-bottom: 1px solid #e0e0e0;
            padding: 1rem 1.25rem;
            background-color: #f8f9fa;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0;
        }
        .card-body {
            padding: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }

    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Travel Information Form</h2>
            </div>
            <div class="card-body">
                <form>
                    <div class="form-group">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email address" required>
                    </div>
                    <div class="form-group">
                        <label for="destination" class="form-label">Destination</label>
                        <input type="text" class="form-control" id="destination" placeholder="Enter your desired destination" required>
                    </div>
                    <div class="form-group">
                        <label for="travelDate" class="form-label">Travel Date</label>
                        <input type="date" class="form-control" id="travelDate" required>
                        <small class="form-text text-muted">Please select your intended travel date.</small>
                    </div>
                    <div class="form-group">
                        <label for="travelType" class="form-label">Type of Travel</label>
                        <select class="form-select" id="travelType">
                            <option value="" disabled selected>Select travel type</option>
                            <option value="leisure">Leisure</option>
                            <option value="business">Business</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="transport" class="form-label">Preferred Transport</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">
                                    <i class="fas fa-plane"></i>
                                </span>
                            </div>
                            <select class="form-select" id="transport">
                                <option value="" disabled selected>Select your preferred transport</option>
                                <option value="flight">Flight</option>
                                <option value="train">Train</option>
                                <option value="bus">Bus</option>
                                <option value="car">Car</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="accommodation" class="form-label">Accommodation</label>
                        <div class="input-group">
                            <div class="input-group-text">
                                <i class="fas fa-hotel"></i>
                            </div>
                            <select class="form-select" id="accommodation">
                                <option value="" disabled selected>Select accommodation type</option>
                                <option value="hotel">Hotel</option>
                                <option value="apartment">Apartment</option>
                                <option value="hostel">Hostel</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-md-6">
                            <button type="submit" class="btn btn-primary btn-block">Submit</button>
                        </div>
                        <div class="col-md-6">
                            <button type="reset" class="btn btn-outline-secondary btn-block">Reset</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js"></script> </body>
</html>
